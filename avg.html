<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculate Average</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="text-center bg-gray-200 m-6 p-3 ">
    <h1 class="bg-gray-400 p-4 text-2xl rounded-xl">Calculate Total Average Marks</h1><br><br>
   
   <div class="bg-gray-300 text-xl rounded-xl hover:scale-105 transition duration-200">
      <label for="number">Subject1:</label>
    <input type="number" name="number" id="num1"><br><br>

   </div><br>

    <div class="bg-gray-300 text-xl rounded-xl hover:scale-105 transition duration-200">
      <label for="number">Subject2:</label>
    <input type="number" name="number" id="num2"><br><br>
    </div><br>

   <div class="bg-gray-300 text-xl rounded-xl hover:scale-105 transition duration-200">
   <label for="number">Subject3:</label>
    <input type="number" name="number" id="num3"><br><br>

   </div><br>

    <div class="bg-gray-300 text-xl rounded-xl hover:scale-105 transition duration-200">
      <label for="number">Subject4:</label>
    <input type="number" name="number" id="num4"><br><br>
    </div><br>

   <div class="bg-gray-300 text-xl rounded-xl hover:scale-105 transition duration-200">
       <label for="number">Subject5:</label>
    <input type="number" name="number" id="num5"><br><br>
   </div><br>
   
    <div class="bg-gray-300 text-3xl rounded-xl hover:scale-105 transition duration-200">
      <button onclick="resultfunc()">ADD</button><br>

    <p id="result">Result</p>
    
    </div>

    <script>
      var box1=document.getElementById("num1")
      var box2=document.getElementById("num2")
      var box3=document.getElementById("num3")
      var box4=document.getElementById("num4")
      var box5=document.getElementById("num5")

        var result=document.getElementById("result")

        
        function resultfunc()
        { 
           var box1value=Number(box1.value)
        var box2value=Number(box2.value)
        var box3value=Number(box3.value)
        var box4value=Number(box4.value)
        var box5value=Number(box5.value)

        var total=box1value+box2value+box3value+box4value+box5value
        var total2=(box1value+box2value+box3value+box4value+box5value)/5


         result.textContent = "Total mark is " +total+"/500" + " And it's Average is "+total2
         
        }
    </script>
</body>
</html>
